name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose
      # - run: cargo test --verbose
      - run: cargo test --verbose -- --test-threads=1 --nocapture
      - name: Diagnose macOS operation-group crash
        if: failure() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          RUST_BACKTRACE=1 cargo test --test basic operation_group_enumerates_and_promotes_candidate --exact --nocapture
