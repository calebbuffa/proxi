name: CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - tests/**
      - native/**
      - .cargo/**
      - rust-toolchain*
      - .github/workflows/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - tests/**
      - native/**
      - .cargo/**
      - rust-toolchain*
      - .github/workflows/**
  workflow_dispatch:

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo and native build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/proxi-cache
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock', 'native/versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-
      - run: cargo build --verbose
      - name: Run angular units serially
        run: cargo test --test angular_units -- --test-threads=1 --nocapture
      - name: Run full test suite serially
        run: cargo test --verbose -- --test-threads=1
