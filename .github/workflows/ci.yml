name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose
      # - run: cargo test --verbose
      - run: cargo test --verbose -- --test-threads=1 --nocapture
      - name: Diagnose macOS operation-group crash
        if: failure() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -o pipefail
          cargo test --test basic operation_group_enumerates_and_promotes_candidate --no-run
          binary=$(find target/debug/deps -maxdepth 1 -type f -name 'basic-*' -perm -111 | head -n 1)
          prefix=$(find "$HOME/.cargo/proxi-cache/builds" -type f -path '*/prefix/share/proj/proj.db' -print -quit | sed 's#/share/proj/proj.db##')
          test -n "$binary"
          test -n "$prefix"
          lldb --batch \
            -o "settings set target.env-vars PROXI_BUNDLED_DATA_DIR=$prefix/share/proj" \
            -o 'breakpoint set --name malloc_error_break' \
            -o 'breakpoint command add -o "bt all" 1' \
            -o 'run operation_group_enumerates_and_promotes_candidate --exact --nocapture' \
            -- "$binary"
      - name: Diagnose Ubuntu operation-group crash
        if: failure() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -o pipefail
          cargo test --test basic operation_group_enumerates_and_promotes_candidate --no-run
          binary=$(find target/debug/deps -maxdepth 1 -type f -name 'basic-*' -executable | head -n 1)
          prefix=$(find "$HOME/.cargo/proxi-cache/builds" -type f -path '*/prefix/share/proj/proj.db' -print -quit | sed 's#/share/proj/proj.db##')
          test -n "$binary"
          test -n "$prefix"
          gdb --batch \
            -ex "set env PROXI_BUNDLED_DATA_DIR=$prefix/share/proj" \
            -ex 'run operation_group_enumerates_and_promotes_candidate --exact --nocapture' \
            -ex 'bt full' \
            --args "$binary"
