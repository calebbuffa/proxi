name: CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - tests/**
      - native/**
      - .cargo/**
      - rust-toolchain*
      - .github/workflows/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - tests/**
      - native/**
      - .cargo/**
      - rust-toolchain*
      - .github/workflows/**
  workflow_dispatch:

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose
      - run: cargo test --verbose
