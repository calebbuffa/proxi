[package]
name = "proxi"
description = "Ergonomic Rust bindings for PROJ"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["proj", "projection", "coordinate", "transformation", "geospatial"]
categories = ["science::geo"]
repository = "https://github.com/calebbuffa/proxi"
links = "proj"

[dependencies]
thiserror = "2.0"
geo = { version = "0.32", optional = true }
nalgebra = { version = "0.33", optional = true }
glam = { version = "0.33", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[build-dependencies]
# Native provisioning: pinned + checksummed sources, a cached build tree,
# CMake, and system discovery. proxi's dependencies ship .tar.gz except the
# SQLite amalgamation, which is a .zip.
woodshed = { version = "0.2.1", features = [
    "zip",
    "cmake",
    "vcpkg",
    "pkg-config",
] }
serde_json = "1.0"      # parse proxi-native-manifest.json
sha2 = "0.10"           # hash embedded PROJ data for cache invalidation

[dev-dependencies]
criterion = "0.5"
serde_json = "1.0"

[[bench]]
name = "throughput"
harness = false

[features]
# Default: full pyproj-like functionality (CURL + TIFF compiled in, network
# downloads opt-in at runtime via ContextOptions::network_enabled).
default = ["network", "tiff"]
# Minimal: PROJ without CURL/TIFF (core transforms + local proj.db only).
minimal = []
# Compile CURL support and expose runtime grid downloading. Independent of
# `tiff`: CURL is only for downloading grids; TIFF is only for reading them.
network = []
# Compile GeoTIFF grid support. Independent of `network`.
tiff = []
# Force the local full superbuild (self-provisioning) even if a system PROJ
# is found.
bundled = []
# Embed bundled PROJ runtime data into dependent binaries and extract it
# automatically for Context::new()/default Context::configure() at runtime.
embedded = ["bundled"]

# Each enables seamless `Coord` integration for a popular geometry/math crate,
# plus `serde` (de)serialization for the coordinate types.
geo = ["dep:geo"]
nalgebra = ["dep:nalgebra"]
glam = ["dep:glam"]
serde = ["dep:serde"]

[package.metadata.docs.rs]
features = ["default"]

[workspace]
