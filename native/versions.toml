# proxi native dependency manifest.
#
# Every native dependency is pinned to an exact version with a fixed HTTPS
# URL and SHA-256 checksum. The archive  cache (`build.rs`) downloads, verifies,
# and extracts these deterministically; subsequent builds never re-download a
# valid archive.
# The checksums below were computed from the official release archives.
# When bumping a dependency, fetch the new archive once, compute
# its SHA-256, and update BOTH the version string and the checksum together.

[proj]
version = "9.4.1"
url = "https://download.osgeo.org/proj/proj-9.4.1.tar.gz"
sha256 = "ffe20170ee2b952207adf8a195e2141eab12cda181e49fdeb54425d98c7171d7"

